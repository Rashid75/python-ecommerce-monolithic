<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Northline — a storefront for the Python Ecommerce API."
    />
    <title>Northline</title>
    <script>
      // Runs before the first paint, so a customer who chose dark never
      // sees a white page flash first. Inline on purpose: a separate file
      // would be fetched after parsing and the flash would be back.
      (function () {
        try {
          var stored = localStorage.getItem("ecommerce.theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (stored === "dark" || (stored === null && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          /* blocked site data: fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
