# Nginx in front of the API: TLS termination, and the things a Python
# process should not be spending its time on.
#
# This file is a template. Replace api.example.com and the certificate
# paths. It is committed because the decisions in it are reviewable; the
# certificates and keys it points at never are.

# Rate limiting at the edge, in addition to the per-process limiter in the
# application. They do different jobs: this one is shared across every
# worker and rejects a flood before Python ever sees it, while the
# application's knows which endpoint is which. Neither replaces the other.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Plain HTTP exists only to send people to HTTPS. It serves nothing else.
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # The ACME challenge path has to stay on HTTP, or certificate renewal
    # cannot complete.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # TLS 1.2 and 1.3 only. 1.0 and 1.1 are withdrawn and are the kind of
    # finding an assessment reports on sight.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling, so a client does not have to make its own round trip
    # to the certificate authority to check revocation.
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS is set here as well as in the application. Nginx answers
    # redirects and error pages that never reach Python, and those need the
    # header too.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Do not advertise the exact Nginx version in responses.
    server_tokens off;

    # A request body larger than this is refused before it is read into
    # memory. Nothing this API accepts is close to 1MB.
    client_max_body_size 1m;

    location / {
        limit_req zone=api burst=40 nodelay;

        proxy_pass http://api;
        proxy_http_version 1.1;

        # What the application needs to know about the original request.
        # X-Forwarded-For matters specifically: the application's rate
        # limiter currently uses the peer address, which behind this proxy
        # is Nginx itself - so every caller would share one bucket.
        #
        # Making the application honour this header requires telling it
        # which proxies to trust (uvicorn --proxy-headers with
        # --forwarded-allow-ips). Without that, any caller could send the
        # header and claim any address. Both halves, or neither.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass through the correlation id if the caller sent one, or let
        # the application generate it. Either way one id spans both logs.
        proxy_set_header X-Request-ID      $http_x_request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        # Longer than the application's 5s lock_timeout, so a slow checkout
        # returns its own 503 rather than being cut off here with a 504
        # that says less.
        proxy_read_timeout    30s;
    }

    # The readiness probe checks the database, so it is kept off the public
    # internet: it is a useful signal for a load balancer and a free
    # availability oracle for anyone else.
    location /health/ready {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://api;
    }
}
